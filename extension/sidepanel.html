<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mainline</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icons/icon32.png" width="18" height="18" alt="" />
      <span>Mainline</span>
    </div>
    <span id="conn" class="conn" title="Connecting…"><i></i><span class="conn-label">connecting</span></span>
    <span class="spacer"></span>
    <button id="refresh" class="icon-btn" title="Refresh" aria-label="Refresh">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/></svg>
    </button>
    <button id="gear" class="icon-btn" title="Settings" aria-label="Settings">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v1.6M8 12.9v1.6M14.5 8h-1.6M3.1 8H1.5M12.6 3.4l-1.1 1.1M4.5 11.5l-1.1 1.1M12.6 12.6l-1.1-1.1M4.5 4.5L3.4 3.4"/></svg>
    </button>
  </header>

  <section id="settings" class="settings" hidden>
    <h2>Settings</h2>
    <label>Mainline server
      <input id="s-server" type="url" spellcheck="false" placeholder="https://gitcrm-production.up.railway.app" />
    </label>
    <label>Reviewer name <small>(recorded as the merger)</small>
      <input id="s-reviewer" type="text" spellcheck="false" placeholder="Joel" />
    </label>
    <label class="check">
      <input id="s-demo" type="checkbox" />
      <span>Demo mapping <small>— map any CRM record to the busiest Mainline record of the same type when it isn't mirrored yet</small></span>
    </label>
    <div class="row">
      <button id="s-save" class="btn primary">Save</button>
      <button id="s-test" class="btn">Test connection</button>
      <button id="s-cancel" class="btn ghost">Cancel</button>
    </div>
    <div id="s-msg" class="s-msg"></div>
    <p class="fine">Custom servers other than the Railway app or localhost:3000 need to be added to <code>host_permissions</code> in manifest.json.</p>
  </section>

  <main id="app" aria-live="polite">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="crms.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
